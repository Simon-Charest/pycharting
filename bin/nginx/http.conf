# /etc/nginx/sites-enabled/http.conf: port 80, for every name.
# Answers Let's Encrypt's checks, and sends everything else to HTTPS (what the router did before).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

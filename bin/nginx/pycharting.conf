# /etc/nginx/sites-enabled/pycharting.conf: HTTPS for pycharting.slcti.ca, reached through stream.conf.
# Enabled once certbot has issued the certificate.
server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name pycharting.slcti.ca;

    ssl_certificate /etc/letsencrypt/live/pycharting.slcti.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pycharting.slcti.ca/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;  # Updating prices waits for PriceCharting
    }
}

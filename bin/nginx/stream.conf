# /etc/nginx/streams-enabled/slcti.conf: the single entrance on port 443.
# Routes each HTTPS connection by the name the browser asks for, without decrypting it,
# so the Node site keeps serving its own Sectigo certificate.
stream {
    map $ssl_preread_server_name $https_backend {
        pycharting.slcti.ca 127.0.0.1:8443;  # nginx, with PyCharting's certificate (pycharting.conf)
        default             127.0.0.1:3000;  # The Node site (resume.service), unchanged
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $https_backend;
    }
}

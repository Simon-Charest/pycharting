<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PyCharting</title>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <link rel="stylesheet" href="/static/collection.css?v=37">
        <script src="/static/collection.js?v=62" defer></script>
    </head>
    <body>
        <header>
            <h1 data-i18n="heading"></h1>
            <nav class="pages">
                <a href="/" aria-current="page" data-i18n="nav.home"></a>
                <a id="nav-users" href="/users" data-i18n="nav.users"></a>
            </nav>
            <div class="account">
                <span id="account-name"></span>
                <button id="logout" class="icon-button" type="button" data-i18n-title="action.logout"></button>
            </div>
            <div class="language" role="group" data-i18n-label="language">
                <button class="icon-button flag" type="button" data-language="fr" lang="fr" title="Français" aria-label="Français"><img src="/static/flag-qc.svg" alt="" width="21" height="14"></button>
                <button class="icon-button flag" type="button" data-language="en" lang="en" title="English" aria-label="English"><img src="/static/flag-ca.svg" alt="" width="28" height="14"></button>
            </div>
        </header>

        <p id="message" class="message" role="alert" hidden></p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr id="headers"></tr>
                    <tr id="filters" class="filters">
                        <td class="select-column"><input id="select-all" type="checkbox" data-i18n-title="action.selectAll"></td>
                        <td>
                            <select id="filter-console" data-i18n-label="column.console"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <input id="filter-title" type="search" data-i18n-label="column.title" data-i18n-placeholder="filter.search">
                        </td>
                        <td>
                            <select id="filter-region" data-i18n-label="column.region"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <select id="filter-quantity" data-i18n-label="column.quantity"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <select id="filter-complete" data-i18n-label="column.complete"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <select id="filter-game" data-i18n-label="column.game"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <select id="filter-box" data-i18n-label="column.box"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <select id="filter-manual" data-i18n-label="column.manual"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <select id="filter-date" data-i18n-label="column.date"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td></td>
                        <td class="paid-column">
                            <select id="filter-paid" data-i18n-label="column.paid"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td class="paid-column"></td>
                        <td>
                            <select id="filter-attribute" data-i18n-label="tags"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td>
                            <select id="filter-owner" data-i18n-label="column.owner"><option value="" data-i18n="filter.all"></option></select>
                        </td>
                        <td class="actions">
                            <button id="update-visible-prices" class="icon-button" type="button" data-i18n-title="action.priceCharting"><img src="/static/pricecharting.ico" alt="" width="16" height="16"></button><!-- No space between the buttons, as in the rows below
                         --><button id="help" class="icon-button" type="button" popovertarget="legend" data-i18n-title="help"></button><!--
                         --><button id="filter-reset" class="icon-button" type="button" data-i18n-title="filter.reset"></button>
                        </td>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
                <tfoot>
                    <tr>
                        <td class="count-cell" colspan="4"><span id="count" role="status"></span></td>
                        <td id="total-quantity" class="number"></td>
                        <td id="total-complete" class="number"></td>
                        <td id="total-game" class="number"></td>
                        <td id="total-box" class="number"></td>
                        <td id="total-manual" class="number"></td>
                        <td></td>
                        <td id="total-subtotal" class="number"></td>
                        <td id="total-paid" class="number paid-column"></td>
                        <td id="total-total" class="number paid-column"></td>
                        <td colspan="2"></td>
                        <td class="add-cell">
                            <button id="add" class="icon-button accent" type="button" data-i18n-title="action.add"></button><!-- No space between the buttons, as in the rows above
                         --><button id="export-csv" class="icon-button" type="button" data-i18n-title="action.exportCsv"></button><!--
                         --><button id="export" class="icon-button" type="button" data-i18n-title="action.export"></button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <p id="bulk-message" class="message info" role="status" hidden></p>

        <div id="legend" class="legend" popover>
            <h2 data-i18n="legend.heading"></h2>
            <ul>
                <li id="legend-previously-owned"></li>
                <li id="legend-totals"></li>
            </ul>
        </div>

        <dialog id="editor">
            <form id="editor-form" method="dialog">
                <h2 id="editor-heading"></h2>
                <div id="editor-fields" class="fields"></div>
                <p id="editor-error" class="message" role="alert" hidden></p>
                <div class="dialog-actions">
                    <button id="editor-cancel" type="button" data-i18n="editor.cancel"></button>
                    <button class="primary" type="submit" data-i18n="editor.save"></button>
                </div>
            </form>
        </dialog>

        <footer class="site-footer">
            <span data-i18n="footer.poweredBy"></span>
            <span data-i18n="footer.privacy"></span>
            <span data-i18n="footer.copyright"></span>
        </footer>
    </body>
</html>

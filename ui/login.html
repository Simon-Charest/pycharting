<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PyCharting</title>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <link rel="stylesheet" href="/static/collection.css?v=30">
        <script src="/static/login.js?v=2" defer></script>
    </head>
    <body>
        <header>
            <h1 data-i18n="heading"></h1>
            <div class="language" role="group" data-i18n-label="language">
                <button class="icon-button flag" type="button" data-language="fr" lang="fr" title="Français" aria-label="Français"><img src="/static/flag-qc.svg" alt="" width="21" height="14"></button>
                <button class="icon-button flag" type="button" data-language="en" lang="en" title="English" aria-label="English"><img src="/static/flag-ca.svg" alt="" width="28" height="14"></button>
            </div>
        </header>

        <main class="login">
            <form id="login-form">
                <h2 data-i18n="login.heading"></h2>
                <div class="fields">
                    <label>
                        <span data-i18n="login.username"></span>
                        <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                    </label>
                    <label>
                        <span data-i18n="login.password"></span>
                        <input name="password" type="password" autocomplete="current-password" required>
                    </label>
                </div>
                <p id="login-error" class="message" role="alert" hidden></p>
                <button class="primary" type="submit" data-i18n="login.submit"></button>
            </form>
        </main>

        <footer class="site-footer">
            <span data-i18n="footer.poweredBy"></span>
            <span data-i18n="footer.privacy"></span>
            <span data-i18n="footer.copyright"></span>
        </footer>
    </body>
</html>
